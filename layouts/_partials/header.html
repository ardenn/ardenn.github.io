<header class="flex items-center justify-between gap-4">
  <a href="{{ site.Home.RelPermalink }}" class="logo" aria-label="{{ site.Params.name }}, home">
    <span class="text-muted">[</span><span class="text-prompt-dir">~/{{ index (split (lower site.Params.name) " ") 0 }}</span><span class="text-muted">]</span>
    <span class="text-prompt-ok">➜</span><span class="logo-cursor" aria-hidden="true"></span>
  </a>
  <nav class="flex items-center gap-5 text-sm" aria-label="Main">
    {{ range site.Menus.main }}
    <a href="{{ .URL }}" class="link-quiet"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>
    {{ end }}
    <button type="button" id="theme-toggle" class="-m-2 cursor-pointer rounded p-2 text-muted hover:text-fg" aria-label="Toggle dark mode">
      <svg class="hidden size-4 dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="size-4 dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </nav>
</header>
